<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="title desc"><title id="title">Comparaison visuelle de DFS et BFS</title><desc id="desc">Deux copies du même graphe montrent l ordre profondeur A B D C et les couches de distance zéro un deux du parcours en largeur.</desc><rect width="860" height="470" fill="#f4f7fc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="38" font-size="23" font-weight="bold" text-anchor="start" fill="#16324f">Même graphe, deux ordres d’exploration</text><rect x="20" y="60" width="395" height="345" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="218" y="88" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">DFS : ordre de découverte</text><line x1="220" y1="114" x2="135" y2="176" stroke="#8096ad" stroke-width="2" marker-end="url(#arrow)"/><line x1="220" y1="114" x2="305" y2="176" stroke="#8096ad" stroke-width="2" marker-end="url(#arrow)"/><line x1="135" y1="224" x2="220" y2="291" stroke="#8096ad" stroke-width="2" marker-end="url(#arrow)"/><line x1="305" y1="224" x2="220" y2="291" stroke="#8096ad" stroke-width="2" marker-end="url(#arrow)"/><line x1="220" y1="339" x2="220" y2="66" stroke="#8096ad" stroke-width="2" marker-end="url(#arrow)"/><circle cx="220" cy="90" r="27" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="220" y="96" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">A</text><circle cx="248" cy="62" r="14" fill="#ffe0a8" stroke="#8096ad" stroke-width="2"/><text x="248" y="67" font-size="12" font-weight="bold" text-anchor="middle" fill="#16324f">1</text><circle cx="135" cy="200" r="27" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="135" y="206" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">B</text><circle cx="163" cy="172" r="14" fill="#ffe0a8" stroke="#8096ad" stroke-width="2"/><text x="163" y="177" font-size="12" font-weight="bold" text-anchor="middle" fill="#16324f">2</text><circle cx="305" cy="200" r="27" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="305" y="206" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">C</text><circle cx="333" cy="172" r="14" fill="#ffe0a8" stroke="#8096ad" stroke-width="2"/><text x="333" y="177" font-size="12" font-weight="bold" text-anchor="middle" fill="#16324f">4</text><circle cx="220" cy="315" r="27" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="220" y="321" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">D</text><circle cx="248" cy="287" r="14" fill="#ffe0a8" stroke="#8096ad" stroke-width="2"/><text x="248" y="292" font-size="12" font-weight="bold" text-anchor="middle" fill="#16324f">3</text><text x="218" y="390" font-size="16" font-weight="bold" text-anchor="middle" fill="#16324f">A → B → D → C</text><rect x="445" y="60" width="395" height="345" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="642" y="88" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">BFS : distance depuis A</text><line x1="645" y1="114" x2="560" y2="176" stroke="#8096ad" stroke-width="2" marker-end="url(#arrow)"/><line x1="645" y1="114" x2="730" y2="176" stroke="#8096ad" stroke-width="2" marker-end="url(#arrow)"/><line x1="560" y1="224" x2="645" y2="291" stroke="#8096ad" stroke-width="2" marker-end="url(#arrow)"/><line x1="730" y1="224" x2="645" y2="291" stroke="#8096ad" stroke-width="2" marker-end="url(#arrow)"/><line x1="645" y1="339" x2="645" y2="66" stroke="#8096ad" stroke-width="2" marker-end="url(#arrow)"/><circle cx="645" cy="90" r="27" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="645" y="96" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">A</text><circle cx="673" cy="62" r="14" fill="#ffe0a8" stroke="#8096ad" stroke-width="2"/><text x="673" y="67" font-size="12" font-weight="bold" text-anchor="middle" fill="#16324f">0</text><circle cx="560" cy="200" r="27" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="560" y="206" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">B</text><circle cx="588" cy="172" r="14" fill="#ffe0a8" stroke="#8096ad" stroke-width="2"/><text x="588" y="177" font-size="12" font-weight="bold" text-anchor="middle" fill="#16324f">1</text><circle cx="730" cy="200" r="27" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="730" y="206" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">C</text><circle cx="758" cy="172" r="14" fill="#ffe0a8" stroke="#8096ad" stroke-width="2"/><text x="758" y="177" font-size="12" font-weight="bold" text-anchor="middle" fill="#16324f">1</text><circle cx="645" cy="315" r="27" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="645" y="321" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">D</text><circle cx="673" cy="287" r="14" fill="#ffe0a8" stroke="#8096ad" stroke-width="2"/><text x="673" y="292" font-size="12" font-weight="bold" text-anchor="middle" fill="#16324f">2</text><text x="642" y="390" font-size="16" font-weight="bold" text-anchor="middle" fill="#16324f">couches 0 → 1 → 2</text><text x="30" y="445" font-size="15" font-weight="normal" text-anchor="start" fill="#16324f">Les petits nombres indiquent l’ordre DFS à gauche et la distance BFS à droite.</text></g></svg>
