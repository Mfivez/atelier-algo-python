<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="title desc"><title id="title">Descente et remontée de factorielle</title><desc id="desc">Factorielle trois appelle factorielle deux puis factorielle un. Le cas de base renvoie un, puis les multiplications donnent deux et six.</desc><rect width="860" height="430" fill="#f4f7fc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="38" font-size="23" font-weight="bold" text-anchor="start" fill="#16324f">Récursion : descendre jusqu’au cas de base, puis remonter</text><text x="210" y="78" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">Descente : les appels attendent</text><rect x="80" y="105" width="220" height="55" rx="10" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><text x="190" y="128" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">factorielle(3)</text><text x="190" y="150" font-size="13" font-weight="normal" text-anchor="middle" fill="#16324f">attend × 3</text><line x1="230" y1="163" x2="285" y2="187" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="135" y="190" width="220" height="55" rx="10" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><text x="245" y="213" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">factorielle(2)</text><text x="245" y="235" font-size="13" font-weight="normal" text-anchor="middle" fill="#16324f">attend × 2</text><line x1="285" y1="248" x2="340" y2="272" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="190" y="275" width="220" height="55" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="300" y="298" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">factorielle(1)</text><text x="300" y="320" font-size="13" font-weight="normal" text-anchor="middle" fill="#16324f">cas de base</text><text x="650" y="78" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">Remontée : les réponses reviennent</text><rect x="545" y="295" width="230" height="55" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="660" y="329" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">retour 1</text><line x1="660" y1="287" x2="660" y2="265" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="545" y="210" width="230" height="55" rx="10" fill="#ffe0a8" stroke="#8096ad" stroke-width="2"/><text x="660" y="244" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">2 × 1 = 2</text><line x1="660" y1="202" x2="660" y2="180" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="545" y="125" width="230" height="55" rx="10" fill="#ffe0a8" stroke="#8096ad" stroke-width="2"/><text x="660" y="159" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">3 × 2 = 6</text><text x="35" y="405" font-size="16" font-weight="normal" text-anchor="start" fill="#16324f">Chaque appel garde son contexte jusqu’au retour de l’appel plus petit.</text></g></svg>
