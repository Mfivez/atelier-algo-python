<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="title desc"><title id="title">Recherche de somme avec deux pointeurs</title><desc id="desc">Sur la liste triée un deux quatre sept onze, la somme douze fait reculer droite, la somme huit fait avancer gauche, puis deux plus sept donne neuf.</desc><rect width="860" height="430" fill="#f4f7fc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="38" font-size="23" font-weight="bold" text-anchor="start" fill="#16324f">Deux pointeurs éliminent une extrémité à chaque étape</text><rect x="85" y="82" width="58" height="46" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="114.0" y="112" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">1</text><rect x="151" y="82" width="58" height="46" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="180.0" y="112" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">2</text><rect x="217" y="82" width="58" height="46" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="246.0" y="112" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">4</text><rect x="283" y="82" width="58" height="46" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="312.0" y="112" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">7</text><rect x="349" y="82" width="58" height="46" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="378.0" y="112" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">11</text><line x1="114" y1="50" x2="114" y2="78" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><line x1="378" y1="50" x2="378" y2="78" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><text x="114" y="42" font-size="13" font-weight="bold" text-anchor="middle" fill="#16324f">gauche</text><text x="378" y="42" font-size="13" font-weight="bold" text-anchor="middle" fill="#16324f">droite</text><rect x="470" y="80" width="340" height="54" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="640" y="102" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">1 + 11 = 12 : trop grand</text><text x="640" y="125" font-size="14" font-weight="normal" text-anchor="middle" fill="#16324f">droite recule</text><rect x="85" y="195" width="58" height="46" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="114.0" y="225" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">1</text><rect x="151" y="195" width="58" height="46" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="180.0" y="225" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">2</text><rect x="217" y="195" width="58" height="46" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="246.0" y="225" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">4</text><rect x="283" y="195" width="58" height="46" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="312.0" y="225" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">7</text><rect x="349" y="195" width="58" height="46" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="378.0" y="225" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">11</text><line x1="114" y1="163" x2="114" y2="191" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><line x1="312" y1="163" x2="312" y2="191" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><text x="114" y="155" font-size="13" font-weight="bold" text-anchor="middle" fill="#16324f">gauche</text><text x="312" y="155" font-size="13" font-weight="bold" text-anchor="middle" fill="#16324f">droite</text><rect x="470" y="193" width="340" height="54" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="640" y="215" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">1 + 7 = 8 : trop petit</text><text x="640" y="238" font-size="14" font-weight="normal" text-anchor="middle" fill="#16324f">gauche avance</text><rect x="85" y="308" width="58" height="46" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="114.0" y="338" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">1</text><rect x="151" y="308" width="58" height="46" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="180.0" y="338" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">2</text><rect x="217" y="308" width="58" height="46" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="246.0" y="338" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">4</text><rect x="283" y="308" width="58" height="46" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="312.0" y="338" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">7</text><rect x="349" y="308" width="58" height="46" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="378.0" y="338" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">11</text><line x1="180" y1="276" x2="180" y2="304" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><line x1="312" y1="276" x2="312" y2="304" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="268" font-size="13" font-weight="bold" text-anchor="middle" fill="#16324f">gauche</text><text x="312" y="268" font-size="13" font-weight="bold" text-anchor="middle" fill="#16324f">droite</text><rect x="470" y="306" width="340" height="54" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="640" y="328" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">2 + 7 = 9</text><text x="640" y="351" font-size="14" font-weight="normal" text-anchor="middle" fill="#16324f">paire trouvée</text><text x="35" y="405" font-size="16" font-weight="normal" text-anchor="start" fill="#16324f">Le tri permet de prouver que la position abandonnée ne peut plus servir.</text></g></svg>
