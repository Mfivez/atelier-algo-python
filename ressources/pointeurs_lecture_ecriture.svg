<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">Deux pointeurs de lecture et d’écriture</title>
  <desc id="desc">Pour compacter les valeurs non nulles, le pointeur lecture inspecte chaque case et le pointeur écriture indique la prochaine place libre.</desc>
  <rect width="900" height="410" fill="#f4f7fc"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs>
  <g font-family="DejaVu Sans,Arial,sans-serif" fill="#16324f">
    <text x="32" y="40" font-size="24" font-weight="bold">Lecture avance toujours, écriture avance quand on conserve</text>
    <text x="35" y="90" font-size="17" font-weight="bold">Départ</text>
    <g stroke="#8096ad" stroke-width="2"><rect x="145" y="64" width="62" height="48" rx="8" fill="#bdebdc"/><rect x="212" y="64" width="62" height="48" rx="8" fill="#fff"/><rect x="279" y="64" width="62" height="48" rx="8" fill="#fff"/><rect x="346" y="64" width="62" height="48" rx="8" fill="#fff"/><rect x="413" y="64" width="62" height="48" rx="8" fill="#fff"/></g>
    <g font-size="18" text-anchor="middle"><text x="176" y="95">1</text><text x="243" y="95">0</text><text x="310" y="95">3</text><text x="377" y="95">0</text><text x="444" y="95">5</text></g>
    <line x1="176" y1="145" x2="176" y2="116" stroke="#8096ad" stroke-width="3" marker-end="url(#a)"/><text x="176" y="167" text-anchor="middle" font-size="14">lecture + écriture</text>
    <text x="35" y="223" font-size="17" font-weight="bold">Après 1, 0, 3</text>
    <g stroke="#8096ad" stroke-width="2"><rect x="145" y="197" width="62" height="48" rx="8" fill="#bdebdc"/><rect x="212" y="197" width="62" height="48" rx="8" fill="#bdebdc"/><rect x="279" y="197" width="62" height="48" rx="8" fill="#ffd98e"/><rect x="346" y="197" width="62" height="48" rx="8" fill="#fff"/><rect x="413" y="197" width="62" height="48" rx="8" fill="#fff"/></g>
    <g font-size="18" text-anchor="middle"><text x="176" y="228">1</text><text x="243" y="228">3</text><text x="310" y="228">3</text><text x="377" y="228">0</text><text x="444" y="228">5</text></g>
    <line x1="310" y1="280" x2="310" y2="249" stroke="#8096ad" stroke-width="3" marker-end="url(#a)"/><text x="310" y="302" text-anchor="middle" font-size="14">écriture : prochaine place</text><line x1="377" y1="168" x2="377" y2="193" stroke="#8096ad" stroke-width="3" marker-end="url(#a)"/><text x="377" y="160" text-anchor="middle" font-size="14">lecture</text>
    <text x="535" y="90" font-size="17" font-weight="bold">Résultat</text>
    <g stroke="#8096ad" stroke-width="2"><rect x="535" y="110" width="62" height="48" rx="8" fill="#bdebdc"/><rect x="602" y="110" width="62" height="48" rx="8" fill="#bdebdc"/><rect x="669" y="110" width="62" height="48" rx="8" fill="#bdebdc"/><rect x="736" y="110" width="62" height="48" rx="8" fill="#fff"/><rect x="803" y="110" width="62" height="48" rx="8" fill="#fff"/></g>
    <g font-size="18" text-anchor="middle"><text x="566" y="141">1</text><text x="633" y="141">3</text><text x="700" y="141">5</text><text x="767" y="141">0</text><text x="834" y="141">0</text></g>
    <rect x="535" y="205" width="330" height="100" rx="12" fill="#fff" stroke="#8096ad"/><text x="555" y="235" font-size="16" font-weight="bold">Invariant</text><text x="555" y="264" font-size="15">avant écriture, les cases à gauche</text><text x="555" y="287" font-size="15">contiennent déjà les valeurs conservées.</text>
    <text x="32" y="384" font-size="16">Les deux indices n’ont pas le même rôle : l’un observe, l’autre construit la zone finale.</text>
  </g>
</svg>
