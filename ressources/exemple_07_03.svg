<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Chapitre 07, point 3 : Pourquoi mémoriser les sommets vus ?</title><desc id="desc">L’ensemble vus empêche de recommencer. A: vus = {A}; B: vus = {A,B}; Retour A: déjà vu : stop. Marquer un sommet casse les cycles du parcours.</desc><rect width="960" height="420" fill="#f4f7fc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30.0" y="34.0" font-size="23" font-weight="bold" text-anchor="start" fill="#16324f">Point 3 — Pourquoi mémoriser les sommets vus ?</text><text x="480.0" y="73.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#16324f">L’ensemble vus empêche de recommencer</text><path d="M340 165 L610 165" stroke="#8096ad" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M655 240 L530 275" stroke="#8096ad" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M425 275 L300 240" stroke="#8096ad" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="270" cy="180" r="72" fill="#dbe9ff" stroke="#8096ad" stroke-width="2"/><text x="270.0" y="168.0" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">A</text><text x="270.0" y="197.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#16324f">vus = {A}</text><circle cx="690" cy="180" r="72" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="690.0" y="168.0" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">B</text><text x="690.0" y="197.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#16324f">vus = {A,B}</text><circle cx="480" cy="285" r="72" fill="#ffd98e" stroke="#8096ad" stroke-width="2"/><text x="480.0" y="273.0" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">Retour A</text><text x="480.0" y="302.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#16324f">déjà vu : stop</text><rect x="115" y="365" width="730" height="38" rx="10" fill="#ffffff" stroke="#8096ad"/><text x="480.0" y="390.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#16324f">Marquer un sommet casse les cycles du parcours.</text></g></svg>
