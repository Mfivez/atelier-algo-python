<svg xmlns="http://www.w3.org/2000/svg" width="860" height="370" viewBox="0 0 860 370" role="img" aria-labelledby="title desc"><title id="title">Arbre de choix du backtracking</title><desc id="desc">Depuis le chemin vide, les choix A et B conduisent aux quatre solutions AA, AB, BA et BB.</desc><rect width="860" height="370" fill="#f4f7fc"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="38" font-size="22" font-weight="bold" fill="#16324f">Backtracking : arbre des choix pour deux symboles</text><line x1="435" y1="109" x2="240" y2="155" stroke="#8096ad" stroke-width="2"/><line x1="435" y1="109" x2="630" y2="155" stroke="#8096ad" stroke-width="2"/><line x1="240" y1="199" x2="125" y2="260" stroke="#8096ad" stroke-width="2"/><line x1="240" y1="199" x2="325" y2="260" stroke="#8096ad" stroke-width="2"/><line x1="630" y1="199" x2="525" y2="260" stroke="#8096ad" stroke-width="2"/><line x1="630" y1="199" x2="725" y2="260" stroke="#8096ad" stroke-width="2"/><rect x="400" y="65" width="75" height="44" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="412" y="93.0" font-size="16" fill="#16324f">vide</text><rect x="205" y="155" width="75" height="44" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="217" y="183.0" font-size="16" fill="#16324f">A</text><rect x="595" y="155" width="75" height="44" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="607" y="183.0" font-size="16" fill="#16324f">B</text><rect x="90" y="260" width="75" height="44" rx="8" fill="#bdebdc" stroke="#8096ad"/><text x="102" y="288.0" font-size="16" fill="#16324f">AA</text><rect x="290" y="260" width="75" height="44" rx="8" fill="#bdebdc" stroke="#8096ad"/><text x="302" y="288.0" font-size="16" fill="#16324f">AB</text><rect x="490" y="260" width="75" height="44" rx="8" fill="#bdebdc" stroke="#8096ad"/><text x="502" y="288.0" font-size="16" fill="#16324f">BA</text><rect x="690" y="260" width="75" height="44" rx="8" fill="#bdebdc" stroke="#8096ad"/><text x="702" y="288.0" font-size="16" fill="#16324f">BB</text><text x="30" y="350" font-size="16" fill="#16324f">Explorer A : AA puis AB. Annuler A. Explorer B : BA puis BB.</text></g></svg>