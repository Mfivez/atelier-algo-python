<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Temps et mémoire sont deux mesures différentes</title>
  <desc id="desc">Deux programmes parcourent cinq valeurs. Le premier garde seulement une somme, le second construit une nouvelle liste de cinq carrés.</desc>
  <rect width="900" height="390" fill="#f4f7fc"/>
  <g font-family="DejaVu Sans,Arial,sans-serif" fill="#16324f">
    <text x="32" y="40" font-size="24" font-weight="bold">Même entrée, deux questions distinctes</text>
    <text x="32" y="78" font-size="16">Entrée</text>
    <g stroke="#8096ad" stroke-width="2">
      <rect x="105" y="55" width="58" height="42" rx="8" fill="#fff"/><rect x="168" y="55" width="58" height="42" rx="8" fill="#fff"/><rect x="231" y="55" width="58" height="42" rx="8" fill="#fff"/><rect x="294" y="55" width="58" height="42" rx="8" fill="#fff"/><rect x="357" y="55" width="58" height="42" rx="8" fill="#fff"/>
    </g>
    <g font-size="16" text-anchor="middle"><text x="134" y="82">2</text><text x="197" y="82">4</text><text x="260" y="82">1</text><text x="323" y="82">3</text><text x="386" y="82">5</text></g>
    <rect x="38" y="125" width="390" height="205" rx="14" fill="#fff" stroke="#8096ad" stroke-width="2"/>
    <text x="58" y="158" font-size="19" font-weight="bold">Sommer</text>
    <text x="58" y="188" font-size="16">Temps : 5 lectures → O(n)</text>
    <g fill="#6dbfa5"><rect x="58" y="207" width="42" height="22" rx="4"/><rect x="106" y="207" width="42" height="22" rx="4"/><rect x="154" y="207" width="42" height="22" rx="4"/><rect x="202" y="207" width="42" height="22" rx="4"/><rect x="250" y="207" width="42" height="22" rx="4"/></g>
    <text x="58" y="265" font-size="16">Mémoire ajoutée : une somme → O(1)</text>
    <rect x="58" y="282" width="82" height="31" rx="7" fill="#ffd98e" stroke="#8096ad"/><text x="99" y="303" text-anchor="middle" font-size="15">total = 15</text>
    <rect x="472" y="125" width="390" height="205" rx="14" fill="#fff" stroke="#8096ad" stroke-width="2"/>
    <text x="492" y="158" font-size="19" font-weight="bold">Créer les carrés</text>
    <text x="492" y="188" font-size="16">Temps : 5 calculs → O(n)</text>
    <g fill="#6dbfa5"><rect x="492" y="207" width="42" height="22" rx="4"/><rect x="540" y="207" width="42" height="22" rx="4"/><rect x="588" y="207" width="42" height="22" rx="4"/><rect x="636" y="207" width="42" height="22" rx="4"/><rect x="684" y="207" width="42" height="22" rx="4"/></g>
    <text x="492" y="265" font-size="16">Mémoire ajoutée : 5 résultats → O(n)</text>
    <g stroke="#8096ad"><rect x="492" y="282" width="52" height="31" rx="7" fill="#ffd98e"/><rect x="550" y="282" width="52" height="31" rx="7" fill="#ffd98e"/><rect x="608" y="282" width="52" height="31" rx="7" fill="#ffd98e"/><rect x="666" y="282" width="52" height="31" rx="7" fill="#ffd98e"/><rect x="724" y="282" width="52" height="31" rx="7" fill="#ffd98e"/></g>
    <g text-anchor="middle" font-size="14"><text x="518" y="303">4</text><text x="576" y="303">16</text><text x="634" y="303">1</text><text x="692" y="303">9</text><text x="750" y="303">25</text></g>
    <text x="32" y="367" font-size="16">Deux algorithmes peuvent avoir le même temps O(n), mais une mémoire différente.</text>
  </g>
</svg>
