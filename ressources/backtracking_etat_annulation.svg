<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">État mutable pendant un backtracking</title>
  <desc id="desc">Une liste chemin reçoit A puis B. Après avoir enregistré AB, B est retiré, puis C est ajouté. L’annulation restaure exactement le chemin A.</desc>
  <rect width="900" height="400" fill="#f4f7fc"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs>
  <g font-family="DejaVu Sans,Arial,sans-serif" fill="#16324f">
    <text x="32" y="40" font-size="24" font-weight="bold">Choisir, explorer, puis restaurer le même état</text>
    <g stroke="#8096ad" stroke-width="2" text-anchor="middle"><rect x="35" y="120" width="130" height="70" rx="12" fill="#fff"/><rect x="205" y="120" width="130" height="70" rx="12" fill="#dbe9ff"/><rect x="375" y="120" width="130" height="70" rx="12" fill="#bdebdc"/><rect x="545" y="120" width="130" height="70" rx="12" fill="#ffd98e"/><rect x="715" y="120" width="150" height="70" rx="12" fill="#dbe9ff"/></g>
    <g font-size="18" font-weight="bold" text-anchor="middle"><text x="100" y="151">[]</text><text x="270" y="151">[A]</text><text x="440" y="151">[A, B]</text><text x="610" y="151">[A]</text><text x="790" y="151">[A, C]</text></g>
    <g font-size="14" text-anchor="middle"><text x="100" y="177">état initial</text><text x="270" y="177">choisir A</text><text x="440" y="177">choisir B</text><text x="610" y="177">annuler B</text><text x="790" y="177">essayer C</text></g>
    <g stroke="#8096ad" stroke-width="3" marker-end="url(#a)"><line x1="165" y1="155" x2="200" y2="155"/><line x1="335" y1="155" x2="370" y2="155"/><line x1="505" y1="155" x2="540" y2="155"/><line x1="675" y1="155" x2="710" y2="155"/></g>
    <rect x="335" y="235" width="210" height="70" rx="12" fill="#fff" stroke="#8096ad" stroke-width="2"/><text x="440" y="264" text-anchor="middle" font-size="16" font-weight="bold">solution enregistrée</text><text x="440" y="289" text-anchor="middle" font-size="16">copie de [A, B]</text><line x1="440" y1="195" x2="440" y2="230" stroke="#8096ad" stroke-width="3" marker-end="url(#a)"/>
    <rect x="565" y="235" width="250" height="70" rx="12" fill="#f7c9d4" stroke="#8096ad" stroke-width="2"/><text x="690" y="264" text-anchor="middle" font-size="16" font-weight="bold">point de contrôle</text><text x="690" y="289" text-anchor="middle" font-size="15">après pop : chemin == [A]</text>
    <text x="32" y="365" font-size="16">Sans l’annulation, C serait ajouté à [A, B] et les branches se mélangeraient.</text>
  </g>
</svg>
