<svg xmlns="http://www.w3.org/2000/svg" width="910" height="400" viewBox="0 0 910 400" role="img" aria-labelledby="title desc"><title id="title">Chaîne Python, moteur regex, texte et résultat</title><desc id="desc">Le code Python contient une chaîne brute antislash d plus. Le moteur l interprète, cherche dans Lot quarante deux et renvoie quarante deux avec ses positions.</desc><rect width="910" height="400" fill="#f4f7fc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="38" font-size="23" font-weight="bold" text-anchor="start" fill="#16324f">Une regex traverse deux lectures avant de produire un résultat</text><rect x="35" y="95" width="175" height="155" rx="10" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><text x="122" y="125" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">Code Python</text><rect x="53" y="145" width="139" height="45" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="122" y="174" font-size="19" font-weight="bold" text-anchor="middle" fill="#16324f">r&quot;\d+&quot;</text><text x="122" y="220" font-size="13" font-weight="normal" text-anchor="middle" fill="#16324f">chaîne brute</text><line x1="215" y1="172" x2="250" y2="172" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="95" width="175" height="155" rx="10" fill="#ffe0a8" stroke="#8096ad" stroke-width="2"/><text x="347" y="125" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">Moteur regex</text><rect x="278" y="145" width="139" height="45" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="347" y="174" font-size="19" font-weight="bold" text-anchor="middle" fill="#16324f">\d+</text><text x="347" y="220" font-size="13" font-weight="normal" text-anchor="middle" fill="#16324f">un ou plusieurs chiffres</text><line x1="440" y1="172" x2="475" y2="172" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="485" y="95" width="175" height="155" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="572" y="125" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">Texte parcouru</text><rect x="503" y="145" width="139" height="45" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="572" y="174" font-size="19" font-weight="bold" text-anchor="middle" fill="#16324f">Lot 42</text><text x="572" y="220" font-size="13" font-weight="normal" text-anchor="middle" fill="#16324f">cherche une occurrence</text><line x1="665" y1="172" x2="700" y2="172" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="710" y="95" width="175" height="155" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="797" y="125" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">Match</text><rect x="728" y="145" width="139" height="45" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="797" y="174" font-size="19" font-weight="bold" text-anchor="middle" fill="#16324f">42</text><text x="797" y="220" font-size="13" font-weight="normal" text-anchor="middle" fill="#16324f">positions 4 à 6</text><text x="35" y="305" font-size="16" font-weight="bold" text-anchor="start" fill="#16324f">1. Python construit la chaîne.</text><text x="35" y="335" font-size="16" font-weight="bold" text-anchor="start" fill="#16324f">2. Le moteur interprète le motif.</text><text x="35" y="365" font-size="16" font-weight="bold" text-anchor="start" fill="#16324f">3. L’API décide si l’on cherche, valide, extrait ou remplace.</text></g></svg>
