<svg xmlns="http://www.w3.org/2000/svg" width="860" height="455" viewBox="0 0 860 455" role="img" aria-labelledby="title desc"><title id="title">Arbre de parenthèses avec élagage</title><desc id="desc">Depuis la racine vide, commencer par une parenthèse fermante est impossible et la branche est coupée. Les branches valides conduisent à deux solutions.</desc><rect width="860" height="455" fill="#f4f7fc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="38" font-size="23" font-weight="bold" text-anchor="start" fill="#16324f">Élaguer : couper seulement une branche impossible</text><line x1="430" y1="106" x2="260" y2="139" stroke="#8096ad" stroke-width="3"/><line x1="430" y1="106" x2="600" y2="139" stroke="#c65f6a" stroke-width="3" stroke-dasharray="7 5"/><line x1="260" y1="191" x2="160" y2="239" stroke="#8096ad" stroke-width="3"/><line x1="260" y1="191" x2="350" y2="239" stroke="#8096ad" stroke-width="3"/><line x1="160" y1="291" x2="120" y2="339" stroke="#8096ad" stroke-width="3"/><line x1="350" y1="291" x2="390" y2="339" stroke="#8096ad" stroke-width="3"/><circle cx="430" cy="80" r="30" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="430" y="87" font-size="16" font-weight="bold" text-anchor="middle" fill="#16324f">vide</text><circle cx="260" cy="165" r="30" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="260" y="172" font-size="16" font-weight="bold" text-anchor="middle" fill="#16324f">(</text><circle cx="600" cy="165" r="30" fill="#f7c5cc" stroke="#8096ad" stroke-width="2"/><text x="600" y="172" font-size="16" font-weight="bold" text-anchor="middle" fill="#16324f">)</text><circle cx="160" cy="265" r="30" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="160" y="272" font-size="16" font-weight="bold" text-anchor="middle" fill="#16324f">((</text><circle cx="350" cy="265" r="30" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="350" y="272" font-size="16" font-weight="bold" text-anchor="middle" fill="#16324f">()</text><circle cx="120" cy="365" r="38" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="120" y="372" font-size="16" font-weight="bold" text-anchor="middle" fill="#16324f">(())</text><circle cx="390" cy="365" r="38" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="390" y="372" font-size="16" font-weight="bold" text-anchor="middle" fill="#16324f">()()</text><line x1="575" y1="140" x2="625" y2="190" stroke="#c65f6a" stroke-width="4"/><line x1="625" y1="140" x2="575" y2="190" stroke="#c65f6a" stroke-width="4"/><text x="700" y="158" font-size="15" font-weight="bold" text-anchor="middle" fill="#16324f">impossible :</text><text x="700" y="181" font-size="14" font-weight="normal" text-anchor="middle" fill="#16324f">ferme avant d’ouvrir</text><text x="35" y="430" font-size="16" font-weight="normal" text-anchor="start" fill="#16324f">Une branche incomplète continue ; une branche impossible est arrêtée immédiatement.</text></g></svg>
