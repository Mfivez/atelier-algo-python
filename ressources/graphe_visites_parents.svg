<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">BFS, sommets visités et parents</title>
  <desc id="desc">Le graphe relie A à B et C, puis B et C à D. La file visite les couches. Le dictionnaire parent permet de reconstruire A B D.</desc>
  <rect width="900" height="420" fill="#f4f7fc"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs>
  <g font-family="DejaVu Sans,Arial,sans-serif" fill="#16324f">
    <text x="32" y="40" font-size="24" font-weight="bold">BFS garde deux mémoires : vus et parents</text>
    <g stroke="#8096ad" stroke-width="3" marker-end="url(#a)"><line x1="150" y1="105" x2="105" y2="185"/><line x1="170" y1="105" x2="235" y2="185"/><line x1="115" y1="220" x2="175" y2="290"/><line x1="230" y1="220" x2="190" y2="290"/></g>
    <g stroke="#8096ad" stroke-width="2" text-anchor="middle" font-size="18" font-weight="bold"><circle cx="160" cy="85" r="32" fill="#bdebdc"/><text x="160" y="92" stroke="none">A</text><circle cx="95" cy="205" r="32" fill="#dbe9ff"/><text x="95" y="212" stroke="none">B</text><circle cx="245" cy="205" r="32" fill="#dbe9ff"/><text x="245" y="212" stroke="none">C</text><circle cx="180" cy="315" r="32" fill="#ffd98e"/><text x="180" y="322" stroke="none">D</text></g>
    <text x="335" y="84" font-size="18" font-weight="bold">Évolution de la file</text>
    <g font-size="16"><rect x="335" y="100" width="220" height="42" rx="8" fill="#fff" stroke="#8096ad"/><text x="352" y="127">[A]</text><rect x="335" y="151" width="220" height="42" rx="8" fill="#fff" stroke="#8096ad"/><text x="352" y="178">[B, C]</text><rect x="335" y="202" width="220" height="42" rx="8" fill="#fff" stroke="#8096ad"/><text x="352" y="229">[C, D]</text><rect x="335" y="253" width="220" height="42" rx="8" fill="#fff" stroke="#8096ad"/><text x="352" y="280">[D]</text></g>
    <text x="610" y="84" font-size="18" font-weight="bold">Parents au premier passage</text>
    <rect x="610" y="100" width="245" height="145" rx="12" fill="#fff" stroke="#8096ad" stroke-width="2"/><g font-size="17"><text x="635" y="132">B ← A</text><text x="635" y="168">C ← A</text><text x="635" y="204">D ← B</text></g>
    <rect x="610" y="270" width="245" height="72" rx="12" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="733" y="298" text-anchor="middle" font-size="16" font-weight="bold">remonter depuis D</text><text x="733" y="326" text-anchor="middle" font-size="18">D ← B ← A</text>
    <text x="32" y="395" font-size="16">« vus » évite les cycles ; « parent » mémorise comment reconstruire le chemin.</text>
  </g>
</svg>
