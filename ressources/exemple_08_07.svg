<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Chapitre 08, point 7 : Complexité et retour arrière du moteur</title><desc id="desc">Un motif ambigu ouvre plusieurs découpages. aaaa: entrée; aaaa: un groupe; aaa + a: deux groupes; aa + aa: autre découpage. Le retour arrière peut explorer beaucoup de possibilités.</desc><rect width="960" height="420" fill="#f4f7fc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30.0" y="34.0" font-size="23" font-weight="bold" text-anchor="start" fill="#16324f">Point 7 — Complexité et retour arrière du moteur</text><text x="480.0" y="73.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#16324f">Un motif ambigu ouvre plusieurs découpages</text><rect x="330.0" y="90.0" width="300.0" height="105.0" rx="14" fill="#dbe9ff" stroke="#8096ad" stroke-width="2"/><circle cx="357.0" cy="117.0" r="17" fill="#5479b8"/><text x="357.0" y="123.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="480.0" y="137.0" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">aaaa</text><text x="480.0" y="172.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#16324f">entrée</text><line x1="480" y1="195" x2="175.3" y2="230" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="30.0" y="235.0" width="290.7" height="120.0" rx="14" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><circle cx="57.0" cy="262.0" r="17" fill="#5479b8"/><text x="57.0" y="268.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="175.3" y="282.0" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">aaaa</text><text x="175.3" y="317.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#16324f">un groupe</text><line x1="480" y1="195" x2="480.0" y2="230" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="334.7" y="235.0" width="290.7" height="120.0" rx="14" fill="#ffd98e" stroke="#8096ad" stroke-width="2"/><circle cx="361.7" cy="262.0" r="17" fill="#5479b8"/><text x="361.7" y="268.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="480.0" y="282.0" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">aaa + a</text><text x="480.0" y="317.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#16324f">deux groupes</text><line x1="480" y1="195" x2="784.7" y2="230" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="639.3" y="235.0" width="290.7" height="120.0" rx="14" fill="#f7c9d4" stroke="#8096ad" stroke-width="2"/><circle cx="666.3" cy="262.0" r="17" fill="#5479b8"/><text x="666.3" y="268.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="784.7" y="282.0" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">aa + aa</text><text x="784.7" y="317.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#16324f">autre découpage</text><rect x="115" y="365" width="730" height="38" rx="10" fill="#ffffff" stroke="#8096ad"/><text x="480.0" y="390.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#16324f">Le retour arrière peut explorer beaucoup de possibilités.</text></g></svg>
