<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Chapitre 03, point 4 : Le prix du tri</title><desc id="desc">Le tri fait partie du coût. Entrée: liste non triée; Préparation: tri : n log n; Recherche: deux indices : n. Ne pas oublier le travail effectué avant le parcours.</desc><rect width="960" height="420" fill="#f4f7fc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30.0" y="34.0" font-size="23" font-weight="bold" text-anchor="start" fill="#16324f">Point 4 — Le prix du tri</text><text x="480.0" y="73.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#16324f">Le tri fait partie du coût</text><rect x="40.0" y="110.0" width="278.7" height="185.0" rx="14" fill="#dbe9ff" stroke="#8096ad" stroke-width="2"/><circle cx="67.0" cy="137.0" r="17" fill="#5479b8"/><text x="67.0" y="143.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="179.3" y="157.0" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">Entrée</text><text x="179.3" y="192.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#16324f">liste non triée</text><line x1="318.7" y1="202" x2="335.7" y2="202" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="340.7" y="110.0" width="278.7" height="185.0" rx="14" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><circle cx="367.7" cy="137.0" r="17" fill="#5479b8"/><text x="367.7" y="143.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="480.0" y="157.0" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">Préparation</text><text x="480.0" y="192.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#16324f">tri : n log n</text><line x1="619.3" y1="202" x2="636.3" y2="202" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="641.3" y="110.0" width="278.7" height="185.0" rx="14" fill="#ffd98e" stroke="#8096ad" stroke-width="2"/><circle cx="668.3" cy="137.0" r="17" fill="#5479b8"/><text x="668.3" y="143.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="780.7" y="157.0" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">Recherche</text><text x="780.7" y="192.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#16324f">deux indices : n</text><rect x="115" y="365" width="730" height="38" rx="10" fill="#ffffff" stroke="#8096ad"/><text x="480.0" y="390.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#16324f">Ne pas oublier le travail effectué avant le parcours.</text></g></svg>
