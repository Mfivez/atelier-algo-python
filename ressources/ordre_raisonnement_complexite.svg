<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
  <title id="title">Ordre de raisonnement pour analyser la complexité</title>
  <desc id="desc">Un parcours en sept étapes : nommer la taille n, suivre un petit exemple, compter le travail, faire grandir n, repérer le travail caché, séparer temps et mémoire, puis justifier la correction.</desc>
  <rect width="1000" height="550" fill="#f4f7fc"/>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#8096ad"/></marker>
  </defs>
  <g font-family="DejaVu Sans,Arial,sans-serif" fill="#16324f">
    <text x="35" y="40" font-size="25" font-weight="bold">L’ordre de raisonnement : une question prépare la suivante</text>
    <rect x="125" y="61" width="750" height="55" rx="14" fill="#ffffff" stroke="#8096ad" stroke-width="2"/>
    <text x="500" y="84" text-anchor="middle" font-size="16" font-weight="bold">Question centrale</text>
    <text x="500" y="105" text-anchor="middle" font-size="16">Quand la quantité de données augmente, comment le programme évolue-t-il ?</text>

    <g stroke="#8096ad" stroke-width="2">
      <rect x="30" y="155" width="210" height="125" rx="14" fill="#dbe9ff"/>
      <rect x="270" y="155" width="210" height="125" rx="14" fill="#bdebdc"/>
      <rect x="510" y="155" width="210" height="125" rx="14" fill="#ffd98e"/>
      <rect x="750" y="155" width="210" height="125" rx="14" fill="#ffd98e"/>
      <rect x="720" y="355" width="240" height="125" rx="14" fill="#f7c9d4"/>
      <rect x="380" y="355" width="240" height="125" rx="14" fill="#dbe9ff"/>
      <rect x="40" y="355" width="240" height="125" rx="14" fill="#bdebdc" stroke-width="3"/>
    </g>

    <g font-size="15" font-weight="bold" text-anchor="middle">
      <circle cx="60" cy="182" r="18" fill="#5479b8"/><text x="60" y="188" fill="#ffffff">1</text>
      <circle cx="300" cy="182" r="18" fill="#3b9278"/><text x="300" y="188" fill="#ffffff">2</text>
      <circle cx="540" cy="182" r="18" fill="#b36b00"/><text x="540" y="188" fill="#ffffff">3</text>
      <circle cx="780" cy="182" r="18" fill="#b36b00"/><text x="780" y="188" fill="#ffffff">4</text>
      <circle cx="750" cy="382" r="18" fill="#a84d68"/><text x="750" y="388" fill="#ffffff">5</text>
      <circle cx="410" cy="382" r="18" fill="#5479b8"/><text x="410" y="388" fill="#ffffff">6</text>
      <circle cx="70" cy="382" r="18" fill="#3b9278"/><text x="70" y="388" fill="#ffffff">7</text>
    </g>

    <g text-anchor="middle">
      <text x="135" y="207" font-size="18" font-weight="bold">Nommer la taille</text>
      <text x="135" y="232" font-size="15">Que représente <tspan font-family="DejaVu Sans Mono,monospace">n</tspan> ?</text>
      <text x="135" y="254" font-size="14">éléments, caractères…</text>

      <text x="375" y="207" font-size="18" font-weight="bold">Suivre un exemple</text>
      <text x="375" y="232" font-size="15">Que fait le programme</text>
      <text x="375" y="254" font-size="14">sur chaque petite étape ?</text>

      <text x="615" y="207" font-size="18" font-weight="bold">Compter le travail</text>
      <text x="615" y="232" font-size="15">Quelle action se répète ?</text>
      <text x="615" y="254" font-size="14">Combien de fois ?</text>

      <text x="855" y="207" font-size="18" font-weight="bold">Faire grandir <tspan font-family="DejaVu Sans Mono,monospace">n</tspan></text>
      <text x="855" y="232" font-size="15">10 → 100 → 1 000</text>
      <text x="855" y="254" font-size="14">Comment le travail grandit-il ?</text>

      <text x="840" y="407" font-size="18" font-weight="bold">Voir le travail caché</text>
      <text x="840" y="432" font-size="15">Une instruction parcourt-elle</text>
      <text x="840" y="454" font-size="14">ou copie-t-elle des données ?</text>

      <text x="500" y="407" font-size="18" font-weight="bold">Séparer les ressources</text>
      <text x="500" y="432" font-size="15">Temps de calcul</text>
      <text x="500" y="454" font-size="14">et mémoire utilisée</text>

      <text x="160" y="407" font-size="18" font-weight="bold">Justifier le résultat</text>
      <text x="160" y="432" font-size="15">Pourquoi est-il correct ?</text>
      <text x="160" y="454" font-size="14">Pourquoi la boucle finit-elle ?</text>
    </g>

    <g stroke="#8096ad" stroke-width="4" fill="none" marker-end="url(#arrow)">
      <line x1="240" y1="217" x2="263" y2="217"/>
      <line x1="480" y1="217" x2="503" y2="217"/>
      <line x1="720" y1="217" x2="743" y2="217"/>
      <path d="M855 280 V325 Q855 340 840 340 V348"/>
      <line x1="720" y1="417" x2="627" y2="417"/>
      <line x1="380" y1="417" x2="287" y2="417"/>
    </g>

    <rect x="215" y="505" width="570" height="31" rx="9" fill="#ffffff" stroke="#8096ad"/>
    <text x="500" y="526" text-anchor="middle" font-size="15">On ne donne un ordre de grandeur qu’après avoir observé et compté.</text>
  </g>
</svg>
