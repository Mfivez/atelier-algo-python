<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="title desc"><title id="title">Fenêtre fixe glissée sur une liste</title><desc id="desc">Trois positions successives montrent la valeur qui sort, celle qui entre et la somme mise à jour.</desc><rect width="860" height="340" fill="#f4f7fc"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="38" font-size="22" font-weight="bold" fill="#16324f">Fenêtre fixe : retirer le sortant, ajouter l’entrant</text><rect x="40" y="70" width="56" height="48" rx="8" fill="#bdebdc" stroke="#8096ad"/><text x="52" y="100.0" font-size="16" fill="#16324f">2</text><rect x="106" y="70" width="56" height="48" rx="8" fill="#bdebdc" stroke="#8096ad"/><text x="118" y="100.0" font-size="16" fill="#16324f">1</text><rect x="172" y="70" width="56" height="48" rx="8" fill="#bdebdc" stroke="#8096ad"/><text x="184" y="100.0" font-size="16" fill="#16324f">5</text><rect x="238" y="70" width="56" height="48" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="250" y="100.0" font-size="16" fill="#16324f">1</text><rect x="304" y="70" width="56" height="48" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="316" y="100.0" font-size="16" fill="#16324f">3</text><rect x="370" y="70" width="56" height="48" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="382" y="100.0" font-size="16" fill="#16324f">2</text><text x="460" y="101" font-size="16" fill="#16324f">Somme = 8</text><rect x="40" y="148" width="56" height="48" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="52" y="178.0" font-size="16" fill="#16324f">2</text><rect x="106" y="148" width="56" height="48" rx="8" fill="#bdebdc" stroke="#8096ad"/><text x="118" y="178.0" font-size="16" fill="#16324f">1</text><rect x="172" y="148" width="56" height="48" rx="8" fill="#bdebdc" stroke="#8096ad"/><text x="184" y="178.0" font-size="16" fill="#16324f">5</text><rect x="238" y="148" width="56" height="48" rx="8" fill="#bdebdc" stroke="#8096ad"/><text x="250" y="178.0" font-size="16" fill="#16324f">1</text><rect x="304" y="148" width="56" height="48" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="316" y="178.0" font-size="16" fill="#16324f">3</text><rect x="370" y="148" width="56" height="48" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="382" y="178.0" font-size="16" fill="#16324f">2</text><text x="460" y="179" font-size="16" fill="#16324f">Somme = 7</text><rect x="40" y="226" width="56" height="48" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="52" y="256.0" font-size="16" fill="#16324f">2</text><rect x="106" y="226" width="56" height="48" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="118" y="256.0" font-size="16" fill="#16324f">1</text><rect x="172" y="226" width="56" height="48" rx="8" fill="#bdebdc" stroke="#8096ad"/><text x="184" y="256.0" font-size="16" fill="#16324f">5</text><rect x="238" y="226" width="56" height="48" rx="8" fill="#bdebdc" stroke="#8096ad"/><text x="250" y="256.0" font-size="16" fill="#16324f">1</text><rect x="304" y="226" width="56" height="48" rx="8" fill="#bdebdc" stroke="#8096ad"/><text x="316" y="256.0" font-size="16" fill="#16324f">3</text><rect x="370" y="226" width="56" height="48" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="382" y="256.0" font-size="16" fill="#16324f">2</text><text x="460" y="257" font-size="16" fill="#16324f">Somme = 9</text><text x="600" y="106" font-size="16" fill="#16324f">8 − 2 + 1 = 7</text><text x="600" y="185" font-size="16" fill="#16324f">7 − 1 + 3 = 9</text><text x="40" y="320" font-size="16" fill="#16324f">Une fenêtre est contiguë. La somme est mise à jour sans tout recalculer.</text></g></svg>