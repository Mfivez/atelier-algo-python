<svg xmlns="http://www.w3.org/2000/svg" width="860" height="365" viewBox="0 0 860 365" role="img" aria-labelledby="title desc"><title id="title">Boucles successives et boucles imbriquées</title><desc id="desc">À gauche, deux parcours de quatre cases donnent huit opérations. À droite, une grille quatre par quatre donne seize opérations.</desc><rect width="860" height="365" fill="#f4f7fc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="38" font-size="23" font-weight="bold" text-anchor="start" fill="#16324f">Deux boucles : leur position change le calcul</text><rect x="25" y="65" width="385" height="270" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="218" y="95" font-size="19" font-weight="bold" text-anchor="middle" fill="#16324f">Boucles successives</text><text x="218" y="122" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">n + n = 2n  →  O(n)</text><rect x="80" y="145" width="48" height="40" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="104.0" y="175" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">1</text><rect x="136" y="145" width="48" height="40" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="160.0" y="175" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">2</text><rect x="192" y="145" width="48" height="40" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="216.0" y="175" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">3</text><rect x="248" y="145" width="48" height="40" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="272.0" y="175" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">4</text><text x="55" y="171" font-size="16" font-weight="bold" text-anchor="start" fill="#16324f">A</text><rect x="80" y="215" width="48" height="40" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="104.0" y="245" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">1</text><rect x="136" y="215" width="48" height="40" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="160.0" y="245" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">2</text><rect x="192" y="215" width="48" height="40" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="216.0" y="245" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">3</text><rect x="248" y="215" width="48" height="40" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="272.0" y="245" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">4</text><text x="55" y="241" font-size="16" font-weight="bold" text-anchor="start" fill="#16324f">B</text><text x="218" y="302" font-size="14" font-weight="normal" text-anchor="middle" fill="#16324f">Deux parcours complets, l’un puis l’autre</text><rect x="450" y="65" width="385" height="270" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="642" y="95" font-size="19" font-weight="bold" text-anchor="middle" fill="#16324f">Boucles imbriquées</text><text x="642" y="122" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">n × n = n²  →  O(n²)</text><rect x="545" y="145" width="38" height="32" rx="5" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><rect x="595" y="145" width="38" height="32" rx="5" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><rect x="645" y="145" width="38" height="32" rx="5" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><rect x="695" y="145" width="38" height="32" rx="5" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><rect x="545" y="187" width="38" height="32" rx="5" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><rect x="595" y="187" width="38" height="32" rx="5" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><rect x="645" y="187" width="38" height="32" rx="5" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><rect x="695" y="187" width="38" height="32" rx="5" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><rect x="545" y="229" width="38" height="32" rx="5" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><rect x="595" y="229" width="38" height="32" rx="5" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><rect x="645" y="229" width="38" height="32" rx="5" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><rect x="695" y="229" width="38" height="32" rx="5" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><rect x="545" y="271" width="38" height="32" rx="5" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><rect x="595" y="271" width="38" height="32" rx="5" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><rect x="645" y="271" width="38" height="32" rx="5" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><rect x="695" y="271" width="38" height="32" rx="5" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><text x="642" y="330" font-size="14" font-weight="normal" text-anchor="middle" fill="#16324f">La boucle intérieure recommence à chaque ligne</text></g></svg>
