<svg xmlns="http://www.w3.org/2000/svg" width="860" height="365" viewBox="0 0 860 365" role="img" aria-labelledby="title desc"><title id="title">Entrée, fonction, sortie et état</title><desc id="desc">Une liste entre dans une fonction somme. La variable total passe de zéro à deux, un, puis cinq.</desc><rect width="860" height="365" fill="#f4f7fc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="38" font-size="23" font-weight="bold" text-anchor="start" fill="#16324f">Une fonction transforme une entrée en sortie</text><text x="58" y="78" font-size="16" font-weight="bold" text-anchor="start" fill="#16324f">entrée</text><rect x="40" y="92" width="55" height="46" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="67.5" y="122" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">2</text><rect x="103" y="92" width="55" height="46" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="130.5" y="122" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">-1</text><rect x="166" y="92" width="55" height="46" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="193.5" y="122" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">4</text><line x1="250" y1="115" x2="330" y2="115" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="340" y="80" width="190" height="72" rx="10" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><text x="435" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">fonction somme</text><text x="435" y="136" font-size="15" font-weight="normal" text-anchor="middle" fill="#16324f">parcourt la liste</text><line x1="540" y1="115" x2="625" y2="115" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="640" y="80" width="170" height="72" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="725" y="108" font-size="16" font-weight="bold" text-anchor="middle" fill="#16324f">sortie</text><text x="725" y="137" font-size="25" font-weight="bold" text-anchor="middle" fill="#16324f">5</text><text x="40" y="205" font-size="19" font-weight="bold" text-anchor="start" fill="#16324f">État de la variable total pendant le parcours</text><rect x="70" y="230" width="145" height="70" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="142" y="254" font-size="14" font-weight="normal" text-anchor="middle" fill="#16324f">départ</text><text x="142" y="285" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">total = 0</text><line x1="220" y1="265" x2="265" y2="265" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="275" y="230" width="145" height="70" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="347" y="254" font-size="14" font-weight="normal" text-anchor="middle" fill="#16324f">après 2</text><text x="347" y="285" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">total = 2</text><line x1="425" y1="265" x2="470" y2="265" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="230" width="145" height="70" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="552" y="254" font-size="14" font-weight="normal" text-anchor="middle" fill="#16324f">après -1</text><text x="552" y="285" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">total = 1</text><line x1="630" y1="265" x2="675" y2="265" stroke="#8096ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="685" y="230" width="145" height="70" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="757" y="254" font-size="14" font-weight="normal" text-anchor="middle" fill="#16324f">après 4</text><text x="757" y="285" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">total = 5</text><text x="40" y="335" font-size="16" font-weight="normal" text-anchor="start" fill="#16324f">Le nombre change ; son sens reste : somme des éléments déjà parcourus.</text></g></svg>
