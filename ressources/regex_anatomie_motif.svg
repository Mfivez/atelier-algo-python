<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">Anatomie progressive d’une expression régulière</title>
  <desc id="desc">Le motif d’identifiant est découpé en début, première lettre, caractères suivants répétés de deux à sept fois, puis fin.</desc>
  <rect width="900" height="410" fill="#f4f7fc"/>
  <g font-family="DejaVu Sans Mono,Consolas,monospace" fill="#16324f">
    <text x="32" y="40" font-size="24" font-weight="bold" font-family="DejaVu Sans,Arial,sans-serif">Lire un motif de gauche à droite, une brique à la fois</text>
    <g stroke="#8096ad" stroke-width="2" text-anchor="middle" font-size="20" font-weight="bold"><rect x="55" y="85" width="70" height="60" rx="10" fill="#ffd98e"/><text x="90" y="122" stroke="none">^</text><rect x="135" y="85" width="190" height="60" rx="10" fill="#bdebdc"/><text x="230" y="122" stroke="none">[A-Za-z]</text><rect x="335" y="85" width="265" height="60" rx="10" fill="#dbe9ff"/><text x="467" y="122" stroke="none">[A-Za-z0-9_]</text><rect x="610" y="85" width="125" height="60" rx="10" fill="#f7c9d4"/><text x="672" y="122" stroke="none">{2,7}</text><rect x="745" y="85" width="70" height="60" rx="10" fill="#ffd98e"/><text x="780" y="122" stroke="none">$</text></g>
    <g font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="15"><text x="90" y="178">début</text><text x="230" y="178">une lettre</text><text x="467" y="178">lettre, chiffre ou _</text><text x="672" y="178">2 à 7 fois</text><text x="780" y="178">fin</text></g>
    <text x="50" y="234" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold">Exemples passés au motif complet</text>
    <g font-family="DejaVu Sans,Arial,sans-serif" font-size="17"><rect x="50" y="255" width="235" height="52" rx="10" fill="#bdebdc"/><text x="72" y="287">Ana_2</text><text x="210" y="287">✓ valide</text><rect x="330" y="255" width="235" height="52" rx="10" fill="#f7c9d4"/><text x="352" y="287">2Ana</text><text x="475" y="287">✗ chiffre au début</text><rect x="610" y="255" width="235" height="52" rx="10" fill="#f7c9d4"/><text x="632" y="287">Ana-2</text><text x="750" y="287">✗ tiret interdit</text></g>
    <rect x="50" y="329" width="795" height="48" rx="10" fill="#fff" stroke="#8096ad"/><text x="447" y="359" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16">Chaque fragment répond à une règle du contrat ; aucun symbole n’est magique.</text>
  </g>
</svg>
