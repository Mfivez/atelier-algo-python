<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-labelledby="title desc"><title id="title">Pile d appels et cache de mémoïsation</title><desc id="desc">La pile contient les appels en attente tandis que le dictionnaire conserve les résultats déjà calculés.</desc><rect width="860" height="350" fill="#f4f7fc"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="38" font-size="22" font-weight="bold" fill="#16324f">RAM du processus Python : deux rôles différents</text><rect x="35" y="65" width="360" height="50" rx="8" fill="#dce9fc" stroke="#8096ad"/><text x="47" y="96.0" font-size="16" fill="#16324f">Pile d’appels</text><rect x="445" y="65" width="380" height="50" rx="8" fill="#bdebdc" stroke="#8096ad"/><text x="457" y="96.0" font-size="16" fill="#16324f">Dictionnaire memo (cache)</text><rect x="35" y="130" width="360" height="42" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="47" y="157.0" font-size="16" fill="#16324f">fibo(5) attend fibo(3)</text><rect x="35" y="183" width="360" height="42" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="47" y="210.0" font-size="16" fill="#16324f">fibo(3) lit memo[3]</text><text x="47" y="263.0" font-size="16" fill="#16324f">Réponse en cours : 2</text><rect x="445" y="130" width="380" height="42" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="457" y="157.0" font-size="16" fill="#16324f">2 → 1</text><rect x="445" y="183" width="380" height="42" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="457" y="210.0" font-size="16" fill="#16324f">3 → 2</text><rect x="445" y="236" width="380" height="42" rx="8" fill="#ffffff" stroke="#8096ad"/><text x="457" y="263.0" font-size="16" fill="#16324f">4 → 3</text><text x="35" y="318" font-size="16" fill="#16324f">Lors de la seconde branche de fibo(5)</text><text x="445" y="318" font-size="16" fill="#16324f">Résultats conservés pour réutilisation</text></g></svg>