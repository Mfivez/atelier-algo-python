<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Du hachage aux cases d’un dictionnaire</title>
  <desc id="desc">Les clés chat, vélo et arbre passent par une fonction de hachage vers des cases. Deux clés peuvent viser la même case et la structure résout cette collision.</desc>
  <rect width="900" height="390" fill="#f4f7fc"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs>
  <g font-family="DejaVu Sans,Arial,sans-serif" fill="#16324f">
    <text x="32" y="40" font-size="24" font-weight="bold">Une clé est transformée en numéro de case</text>
    <g font-size="17" text-anchor="middle"><rect x="45" y="85" width="120" height="44" rx="10" fill="#fff" stroke="#8096ad"/><text x="105" y="113">« chat »</text><rect x="45" y="165" width="120" height="44" rx="10" fill="#fff" stroke="#8096ad"/><text x="105" y="193">« vélo »</text><rect x="45" y="245" width="120" height="44" rx="10" fill="#fff" stroke="#8096ad"/><text x="105" y="273">« arbre »</text></g>
    <rect x="275" y="135" width="190" height="105" rx="16" fill="#dbe9ff" stroke="#8096ad" stroke-width="2"/><text x="370" y="177" font-size="18" font-weight="bold" text-anchor="middle">fonction de hachage</text><text x="370" y="207" font-size="15" text-anchor="middle">clé → nombre</text>
    <g stroke="#8096ad" stroke-width="3" marker-end="url(#a)"><line x1="165" y1="107" x2="275" y2="162"/><line x1="165" y1="187" x2="275" y2="187"/><line x1="165" y1="267" x2="275" y2="212"/><line x1="465" y1="165" x2="600" y2="107"/><line x1="465" y1="190" x2="600" y2="187"/><line x1="465" y1="215" x2="600" y2="267"/></g>
    <g font-size="16"><rect x="600" y="75" width="245" height="64" rx="9" fill="#fff" stroke="#8096ad" stroke-width="2"/><text x="620" y="101" font-weight="bold">case 0</text><text x="690" y="122">chat → 3</text><rect x="600" y="155" width="245" height="64" rx="9" fill="#fff" stroke="#8096ad" stroke-width="2"/><text x="620" y="181" font-weight="bold">case 1</text><text x="690" y="202">vélo → 8</text><rect x="600" y="235" width="245" height="78" rx="9" fill="#fff" stroke="#8096ad" stroke-width="2"/><text x="620" y="261" font-weight="bold">case 2</text><text x="690" y="282">arbre → 5</text><text x="690" y="303">autre clé…</text></g>
    <rect x="590" y="328" width="265" height="38" rx="9" fill="#ffd98e"/><text x="723" y="353" text-anchor="middle" font-size="15">collision : même case, clés distinctes</text>
    <text x="32" y="367" font-size="16">En moyenne, la case est atteinte directement ; la clé reste vérifiée pour éviter une confusion.</text>
  </g>
</svg>
