<svg xmlns="http://www.w3.org/2000/svg" width="900" height="355" viewBox="0 0 900 355" role="img" aria-labelledby="title desc"><title id="title">Méthode de résolution en six étapes</title><desc id="desc">Le flux va du contrat au petit exemple, à la solution simple, à la justification, aux tests puis à l optimisation, avec une boucle de retour en cas d échec.</desc><rect width="900" height="355" fill="#f4f7fc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="38" font-size="23" font-weight="bold" text-anchor="start" fill="#16324f">Une résolution solide avance dans un ordre stable</text><rect x="25" y="105" width="120" height="115" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><circle cx="45" cy="125" r="14" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="45" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#16324f">1</text><text x="85" y="165" font-size="15" font-weight="bold" text-anchor="middle" fill="#16324f">Contrat</text><text x="85" y="195" font-size="12" font-weight="normal" text-anchor="middle" fill="#16324f">entrée, sortie</text><line x1="148" y1="162" x2="162" y2="162" stroke="#8096ad" stroke-width="2" marker-end="url(#arrow)"/><rect x="167" y="105" width="120" height="115" rx="10" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><circle cx="187" cy="125" r="14" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="187" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#16324f">2</text><text x="227" y="165" font-size="15" font-weight="bold" text-anchor="middle" fill="#16324f">Petit exemple</text><text x="227" y="195" font-size="12" font-weight="normal" text-anchor="middle" fill="#16324f">réponse à la main</text><line x1="290" y1="162" x2="304" y2="162" stroke="#8096ad" stroke-width="2" marker-end="url(#arrow)"/><rect x="309" y="105" width="120" height="115" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><circle cx="329" cy="125" r="14" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="329" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#16324f">3</text><text x="369" y="165" font-size="15" font-weight="bold" text-anchor="middle" fill="#16324f">Solution simple</text><text x="369" y="195" font-size="12" font-weight="normal" text-anchor="middle" fill="#16324f">correcte d’abord</text><line x1="432" y1="162" x2="446" y2="162" stroke="#8096ad" stroke-width="2" marker-end="url(#arrow)"/><rect x="451" y="105" width="120" height="115" rx="10" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><circle cx="471" cy="125" r="14" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="471" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#16324f">4</text><text x="511" y="165" font-size="15" font-weight="bold" text-anchor="middle" fill="#16324f">Justification</text><text x="511" y="195" font-size="12" font-weight="normal" text-anchor="middle" fill="#16324f">invariant + coût</text><line x1="574" y1="162" x2="588" y2="162" stroke="#8096ad" stroke-width="2" marker-end="url(#arrow)"/><rect x="593" y="105" width="120" height="115" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><circle cx="613" cy="125" r="14" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="613" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#16324f">5</text><text x="653" y="165" font-size="15" font-weight="bold" text-anchor="middle" fill="#16324f">Tests</text><text x="653" y="195" font-size="12" font-weight="normal" text-anchor="middle" fill="#16324f">bornes + erreurs</text><line x1="716" y1="162" x2="730" y2="162" stroke="#8096ad" stroke-width="2" marker-end="url(#arrow)"/><rect x="735" y="105" width="120" height="115" rx="10" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><circle cx="755" cy="125" r="14" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="755" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#16324f">6</text><text x="795" y="165" font-size="15" font-weight="bold" text-anchor="middle" fill="#16324f">Optimisation</text><text x="795" y="195" font-size="12" font-weight="normal" text-anchor="middle" fill="#16324f">travail réutilisé</text><line x1="785" y1="245" x2="105" y2="245" stroke="#c28a2c" stroke-width="3" marker-end="url(#arrow)"/><text x="445" y="275" font-size="15" font-weight="bold" text-anchor="middle" fill="#16324f">Si les tests échouent, revenir au contrat ou à la solution simple</text><text x="30" y="325" font-size="17" font-weight="bold" text-anchor="start" fill="#16324f">Optimiser est la dernière étape, jamais le point de départ.</text></g></svg>
