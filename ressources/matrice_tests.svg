<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Matrice visuelle de conception des tests</title>
  <desc id="desc">Une matrice classe les cas vide, minimal, nominal, doublons, limite et impossible, avec leur entrée, résultat attendu et risque ciblé.</desc>
  <rect width="900" height="430" fill="#f4f7fc"/>
  <g font-family="DejaVu Sans,Arial,sans-serif" fill="#16324f">
    <text x="32" y="40" font-size="24" font-weight="bold">Un bon jeu de tests explore des familles différentes</text>
    <g stroke="#8096ad" stroke-width="1.5"><rect x="35" y="70" width="830" height="45" fill="#dbe9ff"/><rect x="35" y="115" width="830" height="45" fill="#fff"/><rect x="35" y="160" width="830" height="45" fill="#f8fbff"/><rect x="35" y="205" width="830" height="45" fill="#fff"/><rect x="35" y="250" width="830" height="45" fill="#f8fbff"/><rect x="35" y="295" width="830" height="45" fill="#fff"/><rect x="35" y="340" width="830" height="45" fill="#f8fbff"/><line x1="185" y1="70" x2="185" y2="385"/><line x1="385" y1="70" x2="385" y2="385"/><line x1="565" y1="70" x2="565" y2="385"/></g>
    <g font-size="15"><text x="55" y="98" font-weight="bold">Famille</text><text x="205" y="98" font-weight="bold">Entrée exemple</text><text x="405" y="98" font-weight="bold">Attendu</text><text x="585" y="98" font-weight="bold">Risque ciblé</text><text x="55" y="143">vide</text><text x="205" y="143">[]</text><text x="405" y="143">contrat explicite</text><text x="585" y="143">indice inexistant</text><text x="55" y="188">minimal</text><text x="205" y="188">[7]</text><text x="405" y="188">cas de base</text><text x="585" y="188">off-by-one</text><text x="55" y="233">nominal</text><text x="205" y="233">[2, 1, 5]</text><text x="405" y="233">résultat calculé</text><text x="585" y="233">logique principale</text><text x="55" y="278">doublons</text><text x="205" y="278">[2, 2, 2]</text><text x="405" y="278">selon contrat</text><text x="585" y="278">comptage / ensemble</text><text x="55" y="323">limite</text><text x="205" y="323">valeur = borne</text><text x="405" y="323">incluse ou exclue</text><text x="585" y="323">&lt; contre ≤</text><text x="55" y="368">impossible</text><text x="205" y="368">aucune solution</text><text x="405" y="368">None, [] ou -1</text><text x="585" y="368">sortie oubliée</text></g>
    <text x="32" y="414" font-size="16">Chaque ligne doit avoir un résultat attendu avant l’exécution : sinon ce n’est pas encore un test.</text>
  </g>
</svg>
