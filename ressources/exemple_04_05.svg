<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Chapitre 04, point 5 : Pourquoi un while dans un for peut rester linéaire</title><desc id="desc">Le while ne remet jamais les bornes en arrière. Borne droite: au plus n pas; Borne gauche: au plus n pas. Au total, les deux bornes font au plus 2n déplacements.</desc><rect width="960" height="420" fill="#f4f7fc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30.0" y="34.0" font-size="23" font-weight="bold" text-anchor="start" fill="#16324f">Point 5 — Pourquoi un while dans un for peut rester linéaire</text><text x="480.0" y="73.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#16324f">Le while ne remet jamais les bornes en arrière</text><rect x="65.0" y="110.0" width="355.0" height="185.0" rx="14" fill="#dbe9ff" stroke="#8096ad" stroke-width="2"/><circle cx="92.0" cy="137.0" r="17" fill="#5479b8"/><text x="92.0" y="143.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="242.5" y="157.0" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">Borne droite</text><text x="242.5" y="192.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#16324f">au plus n pas</text><rect x="540.0" y="110.0" width="355.0" height="185.0" rx="14" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><circle cx="567.0" cy="137.0" r="17" fill="#5479b8"/><text x="567.0" y="143.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="717.5" y="157.0" font-size="18" font-weight="bold" text-anchor="middle" fill="#16324f">Borne gauche</text><text x="717.5" y="192.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#16324f">au plus n pas</text><circle cx="480" cy="202" r="32" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="480.0" y="208.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#16324f">VS</text><rect x="115" y="365" width="730" height="38" rx="10" fill="#ffffff" stroke="#8096ad"/><text x="480.0" y="390.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#16324f">Au total, les deux bornes font au plus 2n déplacements.</text></g></svg>
