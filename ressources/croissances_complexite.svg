<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="title desc"><title id="title">Comparaison de O un, O n et O n carré</title><desc id="desc">Pour n égal à un, deux et quatre, le coût constant reste à un, le coût linéaire suit n et le coût quadratique vaut n carré.</desc><rect width="860" height="430" fill="#f4f7fc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8096ad"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="38" font-size="23" font-weight="bold" text-anchor="start" fill="#16324f">Quand n grandit, le travail ne grandit pas toujours pareil</text><text x="300" y="75" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">n = 1</text><text x="500" y="75" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">n = 2</text><text x="700" y="75" font-size="17" font-weight="bold" text-anchor="middle" fill="#16324f">n = 4</text><rect x="35" y="82" width="170" height="70" rx="10" fill="#dce9fc" stroke="#8096ad" stroke-width="2"/><text x="120" y="110" font-size="20" font-weight="bold" text-anchor="middle" fill="#16324f">O(1)</text><text x="120" y="135" font-size="14" font-weight="normal" text-anchor="middle" fill="#16324f">reste stable</text><rect x="270.0" y="88" width="60" height="52" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="300" y="121" font-size="19" font-weight="bold" text-anchor="middle" fill="#16324f">1</text><rect x="470.0" y="88" width="60" height="52" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="500" y="121" font-size="19" font-weight="bold" text-anchor="middle" fill="#16324f">1</text><rect x="670.0" y="88" width="60" height="52" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="700" y="121" font-size="19" font-weight="bold" text-anchor="middle" fill="#16324f">1</text><rect x="35" y="182" width="170" height="70" rx="10" fill="#bdebdc" stroke="#8096ad" stroke-width="2"/><text x="120" y="210" font-size="20" font-weight="bold" text-anchor="middle" fill="#16324f">O(n)</text><text x="120" y="235" font-size="14" font-weight="normal" text-anchor="middle" fill="#16324f">suit n</text><rect x="270.0" y="188" width="60" height="52" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="300" y="221" font-size="19" font-weight="bold" text-anchor="middle" fill="#16324f">1</text><rect x="467.5" y="188" width="65" height="52" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="500" y="221" font-size="19" font-weight="bold" text-anchor="middle" fill="#16324f">2</text><rect x="662.5" y="188" width="75" height="52" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="700" y="221" font-size="19" font-weight="bold" text-anchor="middle" fill="#16324f">4</text><rect x="35" y="282" width="170" height="70" rx="10" fill="#ffe0a8" stroke="#8096ad" stroke-width="2"/><text x="120" y="310" font-size="20" font-weight="bold" text-anchor="middle" fill="#16324f">O(n²)</text><text x="120" y="335" font-size="14" font-weight="normal" text-anchor="middle" fill="#16324f">grandit plus vite</text><rect x="270.0" y="288" width="60" height="52" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="300" y="321" font-size="19" font-weight="bold" text-anchor="middle" fill="#16324f">1</text><rect x="462.5" y="288" width="75" height="52" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="500" y="321" font-size="19" font-weight="bold" text-anchor="middle" fill="#16324f">4</text><rect x="632.5" y="288" width="135" height="52" rx="10" fill="#ffffff" stroke="#8096ad" stroke-width="2"/><text x="700" y="321" font-size="19" font-weight="bold" text-anchor="middle" fill="#16324f">16</text><text x="35" y="405" font-size="16" font-weight="normal" text-anchor="start" fill="#16324f">Les nombres représentent des opérations, pas des secondes.</text></g></svg>
